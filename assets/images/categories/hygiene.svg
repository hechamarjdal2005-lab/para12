<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgcat7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90B0"/>
      <stop offset="100%" style="stop-color:#3A80A0"/>
    </linearGradient>
    <filter id="glow7">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#FFFFFF" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bgcat7)" rx="16"/>
  <circle cx="350" cy="50" r="80" fill="#FFFFFF" opacity="0.06"/>
  <circle cx="50" cy="350" r="60" fill="#FFFFFF" opacity="0.06"/>
  <!-- Hygiene product silhouettes -->
  <g filter="url(#glow7)" transform="translate(200,175)" opacity="0.95">
    <!-- Soap bar -->
    <rect x="-70" y="-10" width="55" height="35" rx="8" fill="#FFFFFF"/>
    <rect x="-65" y="-5" width="45" height="10" rx="5" fill="#D8A83E" opacity="0.5"/>
    <!-- Toothbrush -->
    <rect x="-5" y="-50" width="8" height="80" rx="4" fill="#FFFFFF"/>
    <rect x="-8" y="-55" width="14" height="18" rx="3" fill="#FFFFFF"/>
    <rect x="-6" y="-52" width="10" height="12" rx="2" fill="#E8E8E8"/>
    <!-- Deodorant -->
    <rect x="20" y="-30" width="30" height="65" rx="10" fill="#FFFFFF"/>
    <rect x="25" y="-42" width="20" height="16" rx="4" fill="#FFFFFF"/>
    <ellipse cx="35" cy="-45" rx="12" ry="5" fill="#D8A83E"/>
    <!-- Bubbles -->
    <circle cx="-40" cy="-40" r="8" fill="#FFFFFF" opacity="0.3"/>
    <circle cx="-30" cy="-50" r="5" fill="#FFFFFF" opacity="0.25"/>
    <circle cx="-48" cy="-55" r="4" fill="#FFFFFF" opacity="0.2"/>
  </g>
  <text x="200" y="330" font-family="Georgia,serif" font-size="28" fill="#FFFFFF" text-anchor="middle" font-weight="bold">HYGIÈNE</text>
  <text x="200" y="358" font-family="Arial,sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">Routine Quotidienne</text>
</svg>
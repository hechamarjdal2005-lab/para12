<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgcat8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4E8B61"/>
      <stop offset="50%" style="stop-color:#D8A83E"/>
      <stop offset="100%" style="stop-color:#4E8B61"/>
    </linearGradient>
    <filter id="glow8">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#FFFFFF" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bgcat8)" rx="16"/>
  <circle cx="350" cy="50" r="80" fill="#FFFFFF" opacity="0.06"/>
  <circle cx="50" cy="350" r="60" fill="#FFFFFF" opacity="0.06"/>
  <!-- Gift box silhouette -->
  <g filter="url(#glow8)" transform="translate(200,170)" opacity="0.95">
    <!-- Box base -->
    <rect x="-70" y="-20" width="140" height="90" rx="6" fill="#FFFFFF"/>
    <!-- Box lid -->
    <rect x="-75" y="-45" width="150" height="30" rx="6" fill="#FFFFFF"/>
    <rect x="-75" y="-28" width="150" height="8" fill="#D8A83E"/>
    <!-- Ribbon vertical -->
    <rect x="-6" y="-45" width="12" height="90" fill="#D8A83E"/>
    <!-- Ribbon horizontal -->
    <rect x="-75" y="-38" width="150" height="10" fill="#D8A83E"/>
    <!-- Bow -->
    <ellipse cx="-12" cy="-52" rx="14" ry="10" fill="#D8A83E"/>
    <ellipse cx="12" cy="-52" rx="14" ry="10" fill="#D8A83E"/>
    <circle cx="0" cy="-52" r="7" fill="#C09828"/>
    <!-- Products peeking -->
    <rect x="-55" y="-70" width="16" height="30" rx="4" fill="#FFFFFF" opacity="0.8"/>
    <rect x="15" y="-65" width="20" height="25" rx="4" fill="#FFFFFF" opacity="0.8"/>
    <ellipse cx="45" cy="-55" rx="15" ry="12" fill="#FFFFFF" opacity="0.8"/>
  </g>
  <text x="200" y="330" font-family="Georgia,serif" font-size="28" fill="#FFFFFF" text-anchor="middle" font-weight="bold">PACKS</text>
  <text x="200" y="358" font-family="Arial,sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">Coffrets · Offres Spéciales</text>
</svg>
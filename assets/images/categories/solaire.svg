  <text x="200" y="330" font-family="Georgia,serif" font-size="28" fill="#FFFFFF" text-anchor="middle" font-weight="bold">SOLAIRE</text>
  <text x="200" y="358" font-family="Arial,sans-serif" font-size="14" fill="#FFD700" text-anchor="middle">Protection UV</text>

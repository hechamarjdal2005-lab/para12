    <line x1="200" y1="60" x2="200" y2="45"/>
    <line x1="200" y1="180" x2="200" y2="195"/>
    <line x1="140" y1="120" x2="125" y2="120"/>
    <line x1="260" y1="120" x2="275" y2="120"/>
    <line x1="158" y1="78" x2="147" y2="67"/>
    <line x1="242" y1="78" x2="253" y2="67"/>
    <line x1="158" y1="162" x2="147" y2="173"/>
    <line x1="242" y1="162" x2="253" y2="173"/>
  </g>
  <!-- Sunscreen tube -->
  <g filter="url(#glow5)" transform="translate(200,250)" opacity="0.95">
    <path d="M-35,-60 L-35,45 Q-35,55 -22,55 L22,55 Q35,55 35,45 L35,-60 Z" fill="#FFFFFF"/>
    <rect x="-20" y="-80" width="40" height="24" rx="6" fill="#FFFFFF"/>

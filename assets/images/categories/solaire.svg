      <stop offset="0%" style="stop-color:#FF8C00"/>
      <stop offset="100%" style="stop-color:#E07800"/>
    </linearGradient>
    <filter id="glow5">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#FFFFFF" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bgcat5)" rx="16"/>
  <circle cx="350" cy="50" r="80" fill="#FFFFFF" opacity="0.08"/>

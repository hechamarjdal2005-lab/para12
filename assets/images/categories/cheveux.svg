      <stop offset="0%" style="stop-color:#5A7A4A"/>
      <stop offset="100%" style="stop-color:#4A6A3A"/>
    </linearGradient>
    <filter id="glow2">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#FFFFFF" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bgcat2)" rx="16"/>
  <circle cx="350" cy="50" r="80" fill="#FFFFFF" opacity="0.05"/>
  <circle cx="50" cy="350" r="60" fill="#FFFFFF" opacity="0.05"/>
  <!-- Shampoo bottle silhouette -->
  <g filter="url(#glow2)" transform="translate(200,175)" opacity="0.95">
    <rect x="-45" y="-80" width="90" height="170" rx="14" fill="#FFFFFF"/>
    <rect x="-16" y="-115" width="32" height="40" rx="6" fill="#FFFFFF"/>
    <rect x="-20" y="-125" width="40" height="14" rx="7" fill="#D8A83E"/>
    <rect x="14" y="-122" width="28" height="7" rx="3.5" fill="#D8A83E"/>
    <!-- Mask tub -->
    <ellipse cx="80" cy="10" rx="45" ry="28" fill="#FFFFFF"/>
    <rect x="-80" y="-35" width="90" height="45" fill="#FFFFFF"/>
    <ellipse cx="35" cy="-25" rx="45" ry="28" fill="#FFFFFF"/>
    <ellipse cx="35" cy="-32" rx="47" ry="14" fill="#D8A83E"/>
  </g>
  <text x="200" y="330" font-family="Georgia,serif" font-size="28" fill="#FFFFFF" text-anchor="middle" font-weight="bold">CHEVEUX</text>
  <text x="200" y="358" font-family="Arial,sans-serif" font-size="14" fill="#D8A83E" text-anchor="middle">Soin Capillaire</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg11" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFAF8"/>
      <stop offset="100%" style="stop-color:#F5EDE5"/>
    </linearGradient>
    <linearGradient id="jar11" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="30%" style="stop-color:#FEFEFE"/>
      <stop offset="70%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#EDEDED"/>
    </linearGradient>
    <linearGradient id="lid11" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#D8A83E"/>
      <stop offset="40%" style="stop-color:#E8C050"/>
      <stop offset="100%" style="stop-color:#C09828"/>
    </linearGradient>
    <filter id="shadow11">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-opacity="0.1"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bg11)"/>
  <g filter="url(#shadow11)" transform="translate(200,215)">
    <!-- Small jar body -->
    <ellipse cx="0" cy="25" rx="55" ry="35" fill="url(#jar11)" stroke="#E8E8E8" stroke-width="0.5"/>
    <rect x="-55" y="-30" width="110" height="55" fill="url(#jar11)"/>
    <ellipse cx="0" cy="-30" rx="55" ry="35" fill="url(#jar11)" stroke="#E8E8E8" stroke-width="0.5"/>
    <!-- Lid -->
    <ellipse cx="0" cy="-38" rx="57" ry="16" fill="url(#lid11)"/>
    <rect x="-57" y="-50" width="114" height="14" fill="url(#lid11)"/>
    <ellipse cx="0" cy="-50" rx="57" ry="16" fill="url(#lid11)"/>
    <!-- Gold rim detail -->
    <ellipse cx="0" cy="-38" rx="57" ry="4" fill="#D8A83E" opacity="0.5"/>
    <!-- Label -->
    <rect x="-40" y="-12" width="80" height="50" rx="3" fill="#F5F3EE" opacity="0.92"/>
    <text x="0" y="4" font-family="Arial,sans-serif" font-size="6" fill="#4E8B61" text-anchor="middle" letter-spacing="1">PARAIHSSANE</text>
    <line x1="-25" y1="9" x2="25" y2="9" stroke="#D8A83E" stroke-width="0.8"/>
    <text x="0" y="22" font-family="Georgia,serif" font-size="8" fill="#4E8B61" text-anchor="middle" font-weight="bold">CRÈME</text>
    <text x="0" y="33" font-family="Georgia,serif" font-size="7" fill="#D8A83E" text-anchor="middle" font-style="italic">CONTOUR DES YEUX</text>
    <text x="0" y="44" font-family="Arial,sans-serif" font-size="5" fill="#999" text-anchor="middle">15 ml</text>
    <!-- Highlight -->
    <rect x="-50" y="-28" width="8" height="50" rx="4" fill="rgba(255,255,255,0.15)"/>
  </g>
</svg>
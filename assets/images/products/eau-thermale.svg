<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg13" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F0F8FF"/>
      <stop offset="100%" style="stop-color:#E0EEF8"/>
    </linearGradient>
    <linearGradient id="bottle13" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#D0E8F8"/>
      <stop offset="25%" style="stop-color:#E0F0FF"/>
      <stop offset="50%" style="stop-color:#F0F8FF"/>
      <stop offset="75%" style="stop-color:#E0F0FF"/>
      <stop offset="100%" style="stop-color:#C0D8E8"/>
    </linearGradient>
    <linearGradient id="cap13" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4A90B0"/>
      <stop offset="50%" style="stop-color:#5AA0C0"/>
      <stop offset="100%" style="stop-color:#3A80A0"/>
    </linearGradient>
    <filter id="shadow13">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.1"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bg13)"/>
  <g filter="url(#shadow13)" transform="translate(200,200)">
    <!-- Can body -->
    <rect x="-45" y="-100" width="90" height="210" rx="10" fill="url(#bottle13)" stroke="#B0D0E0" stroke-width="0.5"/>
    <!-- Cap/nozzle -->
    <rect x="-18" y="-130" width="36" height="35" rx="6" fill="url(#cap13)"/>
    <rect x="-8" y="-145" width="16" height="20" rx="4" fill="#3A80A0"/>
    <rect x="-12" y="-152" width="24" height="10" rx="5" fill="#4A90B0"/>
    <!-- Spray button -->
    <rect x="8" y="-148" width="25" height="7" rx="3.5" fill="#3A80A0"/>
    <!-- Label -->
    <rect x="-38" y="-80" width="76" height="130" rx="4" fill="#FFFFFF" opacity="0.92"/>
    <text x="0" y="-60" font-family="Arial,sans-serif" font-size="6" fill="#4A90B0" text-anchor="middle" letter-spacing="1">PARAIHSSANE</text>
    <line x1="-25" y1="-54" x2="25" y2="-54" stroke="#4A90B0" stroke-width="0.8"/>
    <!-- Water drop icon -->
    <path d="M0,-42 Q6,-35 6,-28 Q6,-22 0,-18 Q-6,-22 -6,-28 Q-6,-35 0,-42" fill="#4A90B0" opacity="0.6"/>
    <text x="0" y="-2" font-family="Georgia,serif" font-size="11" fill="#4A90B0" text-anchor="middle" font-weight="bold">EAU</text>
    <text x="0" y="14" font-family="Georgia,serif" font-size="12" fill="#3A80A0" text-anchor="middle" font-weight="bold">THERMALE</text>
    <line x1="-22" y1="22" x2="22" y2="22" stroke="#4A90B0" stroke-width="0.5"/>
    <text x="0" y="36" font-family="Arial,sans-serif" font-size="6" fill="#666" text-anchor="middle">Apaisante · Hydraatante</text>
    <text x="0" y="48" font-family="Arial,sans-serif" font-size="7" fill="#4A90B0" text-anchor="middle">200 ml</text>
    <!-- Highlight -->
    <rect x="-42" y="-95" width="10" height="195" rx="5" fill="rgba(255,255,255,0.2)"/>
  </g>
</svg>
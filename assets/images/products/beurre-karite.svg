<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg14" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF8F0"/>
      <stop offset="100%" style="stop-color:#F5E8D0"/>
    </linearGradient>
    <linearGradient id="jar14" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C09040"/>
      <stop offset="30%" style="stop-color:#D4A050"/>
      <stop offset="70%" style="stop-color:#C09040"/>
      <stop offset="100%" style="stop-color:#A07830"/>
    </linearGradient>
    <linearGradient id="lid14" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F5E8C0"/>
      <stop offset="50%" style="stop-color="#FFF0D0"/>
      <stop offset="100%" style="stop-color:#E8D8A8"/>
    </linearGradient>
    <filter id="shadow14">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bg14)"/>
  <g filter="url(#shadow14)" transform="translate(200,210)">
    <!-- Jar body -->
    <ellipse cx="0" cy="40" rx="80" ry="50" fill="url(#jar14)"/>
    <rect x="-80" y="-40" width="160" height="80" fill="url(#jar14)"/>
    <ellipse cx="0" cy="-40" rx="80" ry="50" fill="url(#jar14)"/>
    <!-- Lid -->
    <ellipse cx="0" cy="-50" rx="83" ry="22" fill="url(#lid14)"/>
    <rect x="-83" y="-68" width="166" height="20" fill="url(#lid14)"/>
    <ellipse cx="0" cy="-68" rx="83" ry="22" fill="url(#lid14)"/>
    <!-- Label -->
    <rect x="-60" y="-20" width="120" height="75" rx="4" fill="#F5F3EE" opacity="0.92"/>
    <text x="0" y="0" font-family="Arial,sans-serif" font-size="7" fill="#8B6914" text-anchor="middle" letter-spacing="1">PARAIHSSANE</text>
    <line x1="-40" y1="6" x2="40" y2="6" stroke="#D8A83E" stroke-width="1"/>
    <text x="0" y="22" font-family="Georgia,serif" font-size="12" fill="#8B6914" text-anchor="middle" font-weight="bold">BEURRE</text>
    <text x="0" y="38" font-family="Georgia,serif" font-size="12" fill="#8B6914" text-anchor="middle" font-weight="bold">DE KARITÉ</text>
    <text x="0" y="52" font-family="Arial,sans-serif" font-size="6" fill="#666" text-anchor="middle">100% Pur · Naturel</text>
    <text x="0" y="64" font-family="Arial,sans-serif" font-size="6" fill="#666" text-anchor="middle">200 ml</text>
    <!-- Highlight -->
    <rect x="-75" y="-35" width="12" height="70" rx="6" fill="rgba(255,255,255,0.12)"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg15" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FAF5FF"/>
      <stop offset="100%" style="stop-color:#F0E8F8"/>
    </linearGradient>
    <linearGradient id="bottle15" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="30%" style="stop-color:#F8F8F8"/>
      <stop offset="70%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#E8E0F0"/>
    </linearGradient>
    <linearGradient id="accent15" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9B59B6"/>
      <stop offset="50%" style="stop-color:#AB69C6"/>
      <stop offset="100%" style="stop-color:#8B49A6"/>
    </linearGradient>
    <filter id="shadow15">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bg15)"/>
  <g filter="url(#shadow15)" transform="translate(200,200)">
    <!-- Can body -->
    <rect x="-40" y="-100" width="80" height="210" rx="12" fill="url(#bottle15)" stroke="#E0D8E8" stroke-width="0.5"/>
    <!-- Cap -->
    <rect x="-16" y="-135" width="32" height="40" rx="6" fill="url(#accent15)"/>
    <rect x="-20" y="-142" width="40" height="12" rx="6" fill="url(#accent15)"/>
    <!-- Spray nozzle -->
    <rect x="10" y="-138" width="28" height="6" rx="3" fill="#8B49A6"/>
    <!-- Label -->
    <rect x="-34" y="-80" width="68" height="140" rx="6" fill="#F5F3EE" opacity="0.92"/>
    <rect x="-34" y="-80" width="68" height="22" fill="#9B59B6"/>
    <text x="0" y="-64" font-family="Arial,sans-serif" font-size="6" fill="#FFFFFF" text-anchor="middle" font-weight="bold">PARAIHSSANE</text>
    <line x1="-26" y1="-58" x2="26" y2="-58" stroke="#D8A83E" stroke-width="1"/>
    <text x="0" y="-38" font-family="Georgia,serif" font-size="11" fill="#9B59B6" text-anchor="middle" font-weight="bold">SPRAY</text>
    <text x="0" y="-20" font-family="Georgia,serif" font-size="12" fill="#8B49A6" text-anchor="middle" font-weight="bold">VOLUMINEUR</text>
    <line x1="-20" y1="-12" x2="20" y2="-12" stroke="#9B59B6" stroke-width="0.5"/>
    <text x="0" y="4" font-family="Arial,sans-serif" font-size="6" fill="#666" text-anchor="middle">Volume · Fixation</text>
    <text x="0" y="18" font-family="Arial,sans-serif" font-size="6" fill="#666" text-anchor="middle">Effet Naturel</text>
    <rect x="-22" y="28" width="44" height="16" rx="8" fill="#9B59B6"/>
    <text x="0" y="39" font-family="Arial,sans-serif" font-size="6" fill="#FFFFFF" text-anchor="middle" font-weight="bold">250 ml</text>
    <!-- Highlight -->
    <rect x="-37" y="-95" width="8" height="195" rx="4" fill="rgba(255,255,255,0.18)"/>
  </g>
</svg>
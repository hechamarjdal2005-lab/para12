    <rect x="-14" y="-140" width="28" height="22" rx="4" fill="url(#dropper4)" stroke="#CCC" stroke-width="0.5"/>
    <!-- Rubber bulb -->
    <ellipse cx="0" cy="-148" rx="14" ry="10" fill="#D8A83E"/>
    <!-- Label -->
    <rect x="-34" y="-60" width="68" height="110" rx="4" fill="#F5F3EE"/>
    <rect x="-34" y="-60" width="68" height="20" fill="#4E8B61"/>
    <text x="0" y="-46" font-family="Arial,sans-serif" font-size="7" fill="#FFFFFF" text-anchor="middle" font-weight="bold">PARAIHSSANE</text>
    <line x1="-28" y1="-40" x2="28" y2="-40" stroke="#D8A83E" stroke-width="1.5"/>
    <text x="0" y="-22" font-family="Georgia,serif" font-size="9" fill="#4E8B61" text-anchor="middle" font-weight="bold">SÉRUM</text>
    <text x="0" y="-8" font-family="Georgia,serif" font-size="10" fill="#D8A83E" text-anchor="middle" font-weight="bold">VITAMINE C</text>
    <line x1="-20" y1="2" x2="20" y2="2" stroke="#4E8B61" stroke-width="0.5"/>
    <text x="0" y="16" font-family="Arial,sans-serif" font-size="6" fill="#666" text-anchor="middle">Anti-Âge · Éclat</text>
    <text x="0" y="28" font-family="Arial,sans-serif" font-size="6" fill="#666" text-anchor="middle">30 ml</text>
    <!-- Highlight -->
    <rect x="-36" y="-75" width="10" height="155" rx="5" fill="rgba(255,255,255,0.15)"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFAF5"/>
      <stop offset="100%" style="stop-color:#F5EDE0"/>
    </linearGradient>
    <linearGradient id="bottle4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C08030"/>
      <stop offset="25%" style="stop-color:#D4943A"/>
      <stop offset="50%" style="stop-color:#E8A840"/>
      <stop offset="75%" style="stop-color:#D4943A"/>
      <stop offset="100%" style="stop-color:#A06820"/>
    </linearGradient>
    <linearGradient id="dropper4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E8E8E8"/>
      <stop offset="50%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#D0D0D0"/>
    </linearGradient>
    <filter id="shadow4">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bg4)"/>
  <g filter="url(#shadow4)" transform="translate(200,205)">
    <!-- Bottle body -->
    <rect x="-40" y="-80" width="80" height="170" rx="10" fill="url(#bottle4)"/>

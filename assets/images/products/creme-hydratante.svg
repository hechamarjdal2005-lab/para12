<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg7" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FAF8F5"/>
      <stop offset="100%" style="stop-color:#F0EDE8"/>
    </linearGradient>
    <linearGradient id="jar7" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="30%" style="stop-color:#FAFAFA"/>
      <stop offset="70%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#E8E8E8"/>
    </linearGradient>
    <linearGradient id="lid7" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#D8A83E"/>
      <stop offset="50%" style="stop-color:#E8C050"/>
      <stop offset="100%" style="stop-color:#C09828"/>
    </linearGradient>
    <filter id="shadow7">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bg7)"/>
  <g filter="url(#shadow7)" transform="translate(200,210)">
    <!-- Jar body -->
    <ellipse cx="0" cy="40" rx="75" ry="50" fill="url(#jar7)" stroke="#E0E0E0" stroke-width="0.5"/>
    <rect x="-75" y="-40" width="150" height="80" fill="url(#jar7)"/>
    <ellipse cx="0" cy="-40" rx="75" ry="50" fill="url(#jar7)" stroke="#E0E0E0" stroke-width="0.5"/>
    <!-- Lid -->
    <ellipse cx="0" cy="-50" rx="78" ry="20" fill="url(#lid7)"/>
    <rect x="-78" y="-65" width="156" height="18" fill="url(#lid7)"/>
    <ellipse cx="0" cy="-65" rx="78" ry="20" fill="url(#lid7)"/>
    <!-- Label on jar -->
    <rect x="-55" y="-20" width="110" height="70" rx="4" fill="#F5F3EE" opacity="0.9"/>
    <text x="0" y="0" font-family="Arial,sans-serif" font-size="7" fill="#4E8B61" text-anchor="middle" letter-spacing="2">PARAIHSSANE</text>
    <line x1="-35" y1="6" x2="35" y2="6" stroke="#D8A83E" stroke-width="1"/>
    <text x="0" y="22" font-family="Georgia,serif" font-size="11" fill="#4E8B61" text-anchor="middle" font-weight="bold">CRÈME</text>
    <text x="0" y="36" font-family="Georgia,serif" font-size="10" fill="#D8A83E" text-anchor="middle" font-style="italic">HYDRATANTE</text>
    <text x="0" y="50" font-family="Arial,sans-serif" font-size="7" fill="#666" text-anchor="middle">CORPS · 400 ml</text>
    <!-- Highlight -->
    <rect x="-70" y="-55" width="15" height="90" rx="7" fill="rgba(255,255,255,0.15)"/>
  </g>
</svg>
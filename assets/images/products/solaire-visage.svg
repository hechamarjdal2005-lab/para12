<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg17" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFCF5"/>
      <stop offset="100%" style="stop-color:#F8F0E0"/>
    </linearGradient>
    <linearGradient id="tube17" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="30%" style="stop-color="#FAFAFA"/>
      <stop offset="70%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#F0F0F0"/>
    </linearGradient>
    <linearGradient id="cap17" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F5A623"/>
      <stop offset="50%" style="stop-color:#FFB84D"/>
      <stop offset="100%" style="stop-color:#E09520"/>
    </linearGradient>
    <filter id="shadow17">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.1"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bg17)"/>
  <g filter="url(#shadow17)" transform="translate(200,200)">
    <!-- Tube body -->
    <path d="M-42,-110 L-42,75 Q-42,92 -25,92 L25,92 Q42,92 42,75 L42,-110 Z" fill="url(#tube17)" stroke="#E8E8E8" stroke-width="0.5"/>
    <!-- Tube cap -->
    <rect x="-25" y="-142" width="50" height="36" rx="8" fill="url(#cap17)"/>
    <!-- Crimp -->
    <rect x="-42" y="82" width="84" height="12" rx="3" fill="#E8E8E8"/>
    <!-- Orange accent stripe -->
    <rect x="-42" y="-110" width="84" height="8" fill="#FF8C00"/>
    <!-- Label -->
    <rect x="-36" y="-90" width="72" height="150" rx="4" fill="#FFFFFF" opacity="0.92"/>
    <text x="0" y="-70" font-family="Arial,sans-serif" font-size="6" fill="#FF8C00" text-anchor="middle" letter-spacing="1">PARAIHSSANE</text>
    <line x1="-26" y1="-64" x2="26" y2="-64" stroke="#FF8C00" stroke-width="0.8"/>
    <!-- Sun icon -->
    <circle cx="0" cy="-48" r="10" fill="#FFD700" opacity="0.7"/>
    <circle cx="0" cy="-48" r="6" fill="#FFA500"/>
    <text x="0" y="-28" font-family="Georgia,serif" font-size="10" fill="#FF8C00" text-anchor="middle" font-weight="bold">PROTECTION</text>
    <text x="0" y="-14" font-family="Georgia,serif" font-size="10" fill="#FF8C00" text-anchor="middle" font-weight="bold">SOLAIRE</text>
    <text x="0" y="2" font-family="Georgia,serif" font-size="12" fill="#E09520" text-anchor="middle" font-weight="bold">VISAGE</text>
    <text x="0" y="20" font-family="Arial,sans-serif" font-size="14" fill="#FF6600" text-anchor="middle" font-weight="bold">SPF 50+</text>
    <line x1="-20" y1="28" x2="20" y2="28" stroke="#FF8C00" stroke-width="0.5"/>
    <text x="0" y="42" font-family="Arial,sans-serif" font-size="6" fill="#666" text-anchor="middle">Non Gras · Anti-Taches</text>
    <text x="0" y="54" font-family="Arial,sans-serif" font-size="6" fill="#666" text-anchor="middle">50 ml</text>
    <!-- Highlight -->
    <rect x="-38" y="-105" width="8" height="185" rx="4" fill="rgba(255,255,255,0.2)"/>
  </g>
</svg>
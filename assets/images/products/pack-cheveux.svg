<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg12" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F5FAF7"/>
      <stop offset="100%" style="stop-color:#E8F0EA"/>
    </linearGradient>
    <filter id="shadow12">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bg12)"/>
  <g filter="url(#shadow12)" transform="translate(200,190)">
    <!-- Back product: shampoo bottle -->
    <g transform="translate(-60,-10) scale(0.7)">
      <rect x="-40" y="-80" width="80" height="160" rx="12" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="0.5"/>
      <rect x="-14" y="-115" width="28" height="40" rx="5" fill="#4E8B61"/>
      <rect x="-34" y="-60" width="68" height="100" rx="6" fill="#4E8B61"/>
      <text x="0" y="-35" font-family="Arial,sans-serif" font-size="6" fill="#D8A83E" text-anchor="middle">PARAIHSSANE</text>
      <text x="0" y="-15" font-family="Georgia,serif" font-size="9" fill="#FFFFFF" text-anchor="middle" font-weight="bold">SHAMPOING</text>
      <text x="0" y="0" font-family="Georgia,serif" font-size="8" fill="#D8A83E" text-anchor="middle">KÉRATINE</text>
      <text x="0" y="20" font-family="Arial,sans-serif" font-size="6" fill="#FFFFFF" text-anchor="middle">400 ml</text>
    </g>
    <!-- Middle product: mask tub -->
    <g transform="translate(10,10) scale(0.75)">
      <ellipse cx="0" cy="30" rx="60" ry="35" fill="#5A7A4A"/>
      <rect x="-60" y="-35" width="120" height="65" fill="#5A7A4A"/>
      <ellipse cx="0" cy="-35" rx="60" ry="35" fill="#5A7A4A"/>
      <ellipse cx="0" cy="-42" rx="62" ry="16" fill="#8B6914"/>
      <rect x="-62" y="-55" width="124" height="16" fill="#8B6914"/>
      <ellipse cx="0" cy="-55" rx="62" ry="16" fill="#8B6914"/>
      <rect x="-42" y="-15" width="84" height="50" rx="3" fill="#F5F3EE" opacity="0.9"/>
      <text x="0" y="5" font-family="Georgia,serif" font-size="10" fill="#5A7A4A" text-anchor="middle" font-weight="bold">MASQUE</text>
      <text x="0" y="20" font-family="Georgia,serif" font-size="10" fill="#8B6914" text-anchor="middle" font-weight="bold">KARITÉ</text>
      <text x="0" y="32" font-family="Arial,sans-serif" font-size="6" fill="#666" text-anchor="middle">250 ml</text>
    </g>
    <!-- Front product: serum -->
    <g transform="translate(70,-5) scale(0.65)">
      <rect x="-30" y="-65" width="60" height="130" rx="8" fill="#D4943A"/>
      <rect x="-12" y="-92" width="24" height="30" rx="4" fill="#D4943A"/>
      <ellipse cx="0" cy="-98" rx="16" ry="8" fill="#E8E8E8"/>
      <rect x="-10" y="-112" width="20" height="16" rx="3" fill="#E8E8E8"/>
      <ellipse cx="0" cy="-118" rx="10" ry="7" fill="#D8A83E"/>
      <rect x="-24" y="-48" width="48" height="80" rx="3" fill="#F5F3EE" opacity="0.92"/>
      <text x="0" y="-30" font-family="Georgia,serif" font-size="7" fill="#4E8B61" text-anchor="middle" font-weight="bold">SÉRUM</text>
      <text x="0" y="-16" font-family="Georgia,serif" font-size="7" fill="#D8A83E" text-anchor="middle">VITAMINE C</text>
      <text x="0" y="5" font-family="Arial,sans-serif" font-size="5" fill="#666" text-anchor="middle">30 ml</text>
    </g>
    <!-- Text -->
    <text x="0" y="120" font-family="Georgia,serif" font-size="16" fill="#4E8B61" text-anchor="middle" font-weight="bold">PACK CHEVEUX</text>
    <text x="0" y="140" font-family="Arial,sans-serif" font-size="9" fill="#D8A83E" text-anchor="middle">Soin Complet · 3 Produits</text>
  </g>
</svg>
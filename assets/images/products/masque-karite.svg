<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg9" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F5F0E8"/>
      <stop offset="100%" style="stop-color:#E8DFD0"/>
    </linearGradient>
    <linearGradient id="tub9" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5A7A4A"/>
      <stop offset="30%" style="stop-color:#6B8E5A"/>
      <stop offset="70%" style="stop-color:#5A7A4A"/>
      <stop offset="100%" style="stop-color:#4A6A3A"/>
    </linearGradient>
    <linearGradient id="lid9" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8B6914"/>
      <stop offset="50%" style="stop-color:#A07818"/>
      <stop offset="100%" style="stop-color:#7A5A10"/>
    </linearGradient>
    <filter id="shadow9">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bg9)"/>
  <g filter="url(#shadow9)" transform="translate(200,210)">
    <!-- Tub body -->
    <ellipse cx="0" cy="35" rx="80" ry="45" fill="url(#tub9)"/>
    <rect x="-80" y="-45" width="160" height="80" fill="url(#tub9)"/>
    <ellipse cx="0" cy="-45" rx="80" ry="45" fill="url(#tub9)"/>
    <!-- Lid -->
    <ellipse cx="0" cy="-55" rx="83" ry="22" fill="url(#lid9)"/>
    <rect x="-83" y="-70" width="166" height="18" fill="url(#lid9)"/>
    <ellipse cx="0" cy="-70" rx="83" ry="22" fill="url(#lid9)"/>
    <!-- Label -->
    <rect x="-58" y="-25" width="116" height="70" rx="4" fill="#F5F3EE" opacity="0.92"/>
    <text x="0" y="-5" font-family="Arial,sans-serif" font-size="7" fill="#5A7A4A" text-anchor="middle" letter-spacing="1">PARAIHSSANE</text>
    <line x1="-38" y1="2" x2="38" y2="2" stroke="#D8A83E" stroke-width="1"/>
    <text x="0" y="20" font-family="Georgia,serif" font-size="14" fill="#5A7A4A" text-anchor="middle" font-weight="bold">MASQUE</text>
    <text x="0" y="38" font-family="Georgia,serif" font-size="16" fill="#8B6914" text-anchor="middle" font-weight="bold">KARITÉ</text>
    <text x="0" y="52" font-family="Arial,sans-serif" font-size="7" fill="#666" text-anchor="middle">Soin Profond · 250 ml</text>
    <!-- Highlight -->
    <rect x="-75" y="-40" width="12" height="70" rx="6" fill="rgba(255,255,255,0.12)"/>
  </g>
</svg>
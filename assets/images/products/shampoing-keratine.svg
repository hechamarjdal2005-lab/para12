<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F5FAF7"/>
      <stop offset="100%" style="stop-color:#E8F2EC"/>
    </linearGradient>
    <linearGradient id="bottle5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="30%" style="stop-color:#F8F8F8"/>
      <stop offset="70%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#E8E8E8"/>
    </linearGradient>
    <linearGradient id="pump5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4E8B61"/>
      <stop offset="50%" style="stop-color:#5A9E72"/>
      <stop offset="100%" style="stop-color:#3D7A50"/>
    </linearGradient>
    <filter id="shadow5">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bg5)"/>
  <g filter="url(#shadow5)" transform="translate(200,200)">
    <!-- Bottle body -->
    <rect x="-50" y="-90" width="100" height="190" rx="14" fill="url(#bottle5)" stroke="#E0E0E0" stroke-width="0.5"/>
    <!-- Pump mechanism -->
    <rect x="-18" y="-140" width="36" height="55" rx="6" fill="url(#pump5)"/>
    <rect x="-25" y="-155" width="50" height="20" rx="10" fill="url(#pump5)"/>
    <rect x="15" y="-150" width="35" height="8" rx="4" fill="#4E8B61"/>
    <!-- Green label area -->
    <rect x="-44" y="-70" width="88" height="130" rx="8" fill="#4E8B61"/>
    <text x="0" y="-48" font-family="Arial,sans-serif" font-size="8" fill="#D8A83E" text-anchor="middle" letter-spacing="2">PARAIHSSANE</text>
    <line x1="-30" y1="-40" x2="30" y2="-40" stroke="#D8A83E" stroke-width="1"/>
    <text x="0" y="-20" font-family="Georgia,serif" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">SHAMPOING</text>
    <text x="0" y="0" font-family="Georgia,serif" font-size="16" fill="#D8A83E" text-anchor="middle" font-weight="bold">KÉRATINE</text>
    <line x1="-25" y1="10" x2="25" y2="10" stroke="#D8A83E" stroke-width="0.8"/>
    <text x="0" y="26" font-family="Arial,sans-serif" font-size="7" fill="#FFFFFF" text-anchor="middle">Réparation Intensive</text>
    <text x="0" y="40" font-family="Arial,sans-serif" font-size="7" fill="#FFFFFF" text-anchor="middle">Cheveux Abîmés</text>
    <rect x="-30" y="50" width="60" height="16" rx="8" fill="#D8A83E"/>
    <text x="0" y="61" font-family="Arial,sans-serif" font-size="7" fill="#4E8B61" text-anchor="middle" font-weight="bold">400 ml</text>
    <!-- Highlight -->
    <rect x="-46" y="-85" width="12" height="175" rx="6" fill="rgba(255,255,255,0.18)"/>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4E8B61"/>
      <stop offset="50%" style="stop-color:#3D7A50"/>
      <stop offset="100%" style="stop-color:#2D6A40"/>
    </linearGradient>
    <linearGradient id="goldShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C09828"/>
      <stop offset="50%" style="stop-color:#E8C050"/>
      <stop offset="100%" style="stop-color:#C09828"/>
    </linearGradient>
    <filter id="heroShadow">
      <feDropShadow dx="3" dy="6" stdDeviation="8" flood-opacity="0.2"/>
    </filter>
    <filter id="glowHero">
      <feDropShadow dx="0" dy="0" stdDeviation="15" flood-color="#D8A83E" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="800" height="400" fill="url(#heroBg)"/>
  <!-- Decorative circles -->
  <circle cx="700" cy="80" r="120" fill="#FFFFFF" opacity="0.04"/>
  <circle cx="100" cy="350" r="80" fill="#FFFFFF" opacity="0.04"/>
  <circle cx="400" cy="50" r="60" fill="#D8A83E" opacity="0.08"/>
  <!-- Gold decorative line -->
  <rect x="0" y="0" width="800" height="4" fill="url(#goldShine)"/>
  <rect x="0" y="396" width="800" height="4" fill="url(#goldShine)"/>
  <!-- Product group - left side -->
  <g filter="url(#heroShadow)" transform="translate(160,200)">
    <!-- Serum bottle -->
    <g transform="translate(-40,-20) scale(0.8)">
      <rect x="-18" y="-50" width="36" height="90" rx="6" fill="#D4943A"/>
      <rect x="-8" y="-68" width="16" height="22" rx="3" fill="#D4943A"/>
      <ellipse cx="0" cy="-72" rx="10" ry="6" fill="#E8E8E8"/>
      <rect x="-8" y="-82" width="16" height="14" rx="3" fill="#E8E8E8"/>
      <ellipse cx="0" cy="-86" rx="8" ry="5" fill="#D8A83E"/>
      <rect x="-14" y="-35" width="28" height="60" rx="2" fill="#F5F3EE" opacity="0.9"/>
      <text x="0" y="-18" font-family="Georgia,serif" font-size="6" fill="#4E8B61" text-anchor="middle" font-weight="bold">SÉRUM</text>
      <text x="0" y="-8" font-family="Georgia,serif" font-size="5" fill="#D8A83E" text-anchor="middle">VIT. C</text>
    </g>
    <!-- Shampoo bottle -->
    <g transform="translate(20,-10) scale(0.75)">
      <rect x="-22" y="-45" width="44" height="95" rx="8" fill="#FFFFFF"/>
      <rect x="-8" y="-62" width="16" height="22" rx="4" fill="#4E8B61"/>
      <rect x="-18" y="-30" width="36" height="60" rx="4" fill="#4E8B61"/>
      <text x="0" y="-10" font-family="Georgia,serif" font-size="6" fill="#FFFFFF" text-anchor="middle" font-weight="bold">SHAMPOING</text>
      <text x="0" y="0" font-family="Georgia,serif" font-size="5" fill="#D8A83E" text-anchor="middle">KÉRATINE</text>
    </g>
  </g>
  <!-- Product group - right side -->
  <g filter="url(#heroShadow)" transform="translate(640,200)">
    <!-- Cream jar -->
    <g transform="translate(0,-15) scale(0.8)">
      <ellipse cx="0" cy="20" rx="45" ry="28" fill="#FFFFFF"/>
      <rect x="-45" y="-20" width="90" height="40" fill="#FFFFFF"/>
      <ellipse cx="0" cy="-20" rx="45" ry="28" fill="#FFFFFF"/>
      <ellipse cx="0" cy="-26" rx="47" ry="12" fill="#D8A83E"/>
      <rect x="-47" y="-36" width="94" height="12" fill="#D8A83E"/>
      <ellipse cx="0" cy="-36" rx="47" ry="12" fill="#D8A83E"/>
      <rect x="-32" y="-8" width="64" height="25" rx="2" fill="#F5F3EE" opacity="0.9"/>
      <text x="0" y="6" font-family="Georgia,serif" font-size="7" fill="#4E8B61" text-anchor="middle" font-weight="bold">CRÈME HYDRATANTE</text>
    </g>
    <!-- Sunscreen tube -->
    <g transform="translate(-50,10) scale(0.7)">
      <path d="M-20,-45 L-20,35 Q-20,42 -12,42 L12,42 Q20,42 20,35 L20,-45 Z" fill="#FFB84D"/>
      <rect x="-12" y="-58" width="24" height="16" rx="4" fill="#FFFFFF"/>
      <rect x="-20" y="38" width="40" height="5" rx="2" fill="#E09520"/>
      <rect x="-16" y="-35" width="32" height="55" rx="2" fill="#FFFFFF" opacity="0.9"/>
      <text x="0" y="-20" font-family="Georgia,serif" font-size="5" fill="#FF8C00" text-anchor="middle" font-weight="bold">SPF50+</text>
    </g>
  </g>
  <!-- Center text -->
  <g transform="translate(400,160)">
    <text x="0" y="0" font-family="Arial,sans-serif" font-size="14" fill="#D8A83E" text-anchor="middle" letter-spacing="6">PARAIHSSANE</text>
    <text x="0" y="40" font-family="Georgia,serif" font-size="36" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Beauté Naturelle</text>
    <text x="0" y="70" font-family="Georgia,serif" font-size="18" fill="#D8A83E" text-anchor="middle" font-style="italic">du Maroc</text>
    <rect x="-60" y="85" width="120" height="2" fill="#D8A83E" opacity="0.6"/>
    <text x="0" y="115" font-family="Arial,sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle" opacity="0.85">Parapharmacie · Cosmétiques · Bien-être</text>
  </g>
  <!-- Bottom text -->
  <text x="400" y="370" font-family="Arial,sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle" opacity="0.6">Produits naturels · Livraison au Maroc · Paiement à la livraison</text>
</svg>